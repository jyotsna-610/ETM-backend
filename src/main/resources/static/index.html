<!DOCTYPE html>

<head>

        <div class="buttons">
            <button onclick="window.location.href='/employee-login'">

</button>
           <button onclick="window.location.href='/admin-login'">

</button>

           <button onclick="window.location.href='/tasks'">

</button>
